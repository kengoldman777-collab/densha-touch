<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3e8"><title>でんしゃタッチ｜ちいさな てつどうの たび</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div><span class="eyebrow">ちいさな てつどうの たび</span><h1>でんしゃ<span>タッチ</span></h1></div><div class="controls"><button id="sound" aria-pressed="false">♪ おと OFF</button><button id="pause" aria-pressed="false">Ⅱ とまる</button></div></header>
<section class="journey" aria-label="ステージ"><div><span id="stageIcon">🏡</span> <strong id="stageName">まち</strong><span class="trip">ぐるっと たびしよう</span></div><div id="dots" aria-label="全4ステージ"></div><span id="remaining">あと 30 びょう</span><div class="progress"><i id="progress"></i></div></section>
<section class="playground"><canvas id="game" tabindex="0" aria-label="ここをタッチして電車を走らせよう。キーボードではEnterで出発。"></canvas><div class="hint" id="hint">ゆびで タッチ！ <span>でんしゃが はしるよ</span></div><div id="announcement" class="announcement" aria-live="polite"></div><div id="paused" hidden>ひとやすみ ☁<small>「▶ はしる」で つづけよう</small></div></section>
<footer><div class="select-label">どの でんしゃに する？ <span>なんかいでも タッチしてね</span></div><nav id="trains" aria-label="電車を選ぶ"></nav><p class="note">タッチで しゅっぱつ。 ふみきりでは くるまが まつよ。</p></footer>
</main><script src="engine.js"></script><script src="game.js"></script></body></html>
