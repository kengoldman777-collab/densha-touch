<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a7c486"><title>でんしゃタッチ</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><main><canvas id="game" tabindex="0" aria-label="タッチすると電車が出発します。Enterキーでも遊べます。"></canvas>
<div class="place"><span id="stageIcon">🏡</span> <strong id="stageName">まち</strong></div>
<div class="controls"><button id="fullscreen" aria-label="全画面で遊ぶ">⛶ おおきく</button><button id="sound" aria-pressed="false">♪ おと ON</button><button id="pause" aria-pressed="false">Ⅱ とまる</button></div>
<div id="hint">タッチで しゅっぱつ！<small class="rotate">スマホを よこにすると ひろく あそべるよ</small></div>
<div id="announcement" aria-live="polite"></div><div id="paused" hidden>ひとやすみ ☁<small>「▶ はしる」で つづけよう</small></div>
</main><script src="engine.js?v=3"></script><script src="game.js?v=3"></script></body></html>
